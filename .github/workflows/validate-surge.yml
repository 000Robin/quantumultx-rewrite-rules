name: Validate Surge conversion

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Surge artifacts
        run: python surge/tools/validate_surge.py
      - name: Test Surge script adapters
        run: node surge/tests/scripts.test.js

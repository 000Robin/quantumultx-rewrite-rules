# 自动选择在被请求使用时才测速，避免每 5 分钟后台唤醒；80 ms 容差减少频繁切换。
url-latency-benchmark=自动选择, server-tag-regex=(?i)^(?!.*(?:网易|墨鱼|剩余|流量|到期|官网|公告|客服|套餐|更新|Traffic|Expire|Reset|Remaining)).+$, check-interval=600, alive-checking=false, tolerance=80, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
url-latency-benchmark=AI自动, server-tag-regex=(?i)^(?!.*(?:香港|港|HK|Hong|澳门|Macao|俄罗斯|Russia|网易|墨鱼|剩余|流量|到期|官网|公告|客服|套餐|更新|Traffic|Expire|Reset|Remaining))(?=.*(?:台湾|台灣|台|TW|Taiwan|日本|日|JP|Japan|新加坡|狮城|獅城|SG|Singapore|美国|美國|美|US|United States|American|韩国|韓國|韩|韓|KR|Korea)).+$, check-interval=600, alive-checking=false, tolerance=80, img-url=https://raw.githubusercontent.com/ddgksf2013/Icon/master/qx/ai.png


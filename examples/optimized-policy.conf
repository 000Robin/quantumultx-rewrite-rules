[policy]
# 两层总控：Shawn 控制全局；全球加速负责节点选择。final 直接交给 Shawn，删除重复兜底层。
static=Shawn, 全球加速, direct, proxy, reject
static=全球加速, 自动选择, 香港节点, 台湾节点, 日本节点, 狮城节点, 韩国节点, 美国节点, proxy, direct, reject, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/Global.png

# AI 只从已支持地区自动测速，同时保留手动切换入口；不提供香港/澳门/俄罗斯节点。
static=ChatGPT, AI自动, 美国节点, 日本节点, 狮城节点, 台湾节点, 韩国节点, 自动选择, proxy, reject, img-url=https://raw.githubusercontent.com/ddgksf2013/Icon/master/qx/ai.png

